<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
     <Files ".env">
    Require all denied
   </Files>
    <Files ".htaccess">
    Require all denied
   </Files>

    # Optimize Apache settings
    KeepAlive On
    MaxKeepAliveRequests 500
    KeepAliveTimeout 5
    Timeout 600
    ErrorLog /var/log/apache2/piloting-error.log
    CustomLog /var/log/apache2/piloting-access.log combined

    # Load mod_headers module
    LoadModule headers_module modules/mod_headers.so

    # Match PDF files and set headers
    <FilesMatch "\.(pdf)$">
        ForceType application/pdf
        Header set Content-Disposition attachment
    </FilesMatch>
</VirtualHost>
